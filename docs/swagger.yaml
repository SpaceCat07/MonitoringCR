basePath: /
definitions:
  controllers.createActivityRequest:
    properties:
      action:
        enum:
        - Comment
        - Change
        type: string
      activity:
        type: string
      comment:
        type: string
      cr_id:
        type: integer
    required:
    - action
    - cr_id
    type: object
  controllers.createCRRequest:
    properties:
      category:
        enum:
        - FLOW
        - REPORT
        - INTERFACE
        - CONVERTION
        - ENHANCEMENT
        - FORM
        - CONFIGURATION
        - AUTORIZATION
        type: string
      description:
        minLength: 3
        type: string
      end_date:
        type: string
      file_attachment:
        items:
          type: string
        minItems: 1
        type: array
      goal:
        type: string
      impact:
        type: string
      keterangan:
        type: string
      modul:
        enum:
        - FINANCE
        - MATERIAL MANAGEMENT
        - HUMAN RESOURCE
        - BASIS
        - ABAP
        type: string
      pic_id:
        type: integer
      release_date:
        type: string
      start_date:
        type: string
      status:
        enum:
        - DRAFT
        - ISSUED
        - IN_PROGRESS
        - APPROVAL_TO_RELEASE
        - RELEASE
        - APPROVAL_TO_COMPLETE
        - COMPLETE
        - CANCEL
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - category
    - description
    - end_date
    - file_attachment
    - goal
    - impact
    - modul
    - release_date
    - start_date
    - title
    type: object
  controllers.createSubtaskRequest:
    properties:
      collaborator_id:
        type: integer
      cr_id:
        type: integer
      done:
        type: boolean
      due_date:
        type: string
      progress:
        maximum: 100
        type: integer
      task_name:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - cr_id
    - due_date
    - task_name
    type: object
  controllers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  controllers.updateActivityRequest:
    properties:
      action:
        enum:
        - Comment
        - Change
        type: string
      activity:
        type: string
      comment:
        type: string
    required:
    - action
    type: object
  controllers.updateCRRequest:
    properties:
      category:
        enum:
        - FLOW
        - REPORT
        - INTERFACE
        - CONVERTION
        - ENHANCEMENT
        - FORM
        - CONFIGURATION
        - AUTORIZATION
        type: string
      description:
        minLength: 3
        type: string
      end_date:
        type: string
      file_attachment:
        items:
          type: string
        minItems: 1
        type: array
      goal:
        type: string
      impact:
        type: string
      keterangan:
        type: string
      modul:
        enum:
        - FINANCE
        - MATERIAL MANAGEMENT
        - HUMAN RESOURCE
        - BASIS
        - ABAP
        type: string
      pic_id:
        type: integer
      release_date:
        type: string
      start_date:
        type: string
      status:
        enum:
        - DRAFT
        - ISSUED
        - IN_PROGRESS
        - APPROVAL_TO_RELEASE
        - RELEASE
        - APPROVAL_TO_COMPLETE
        - COMPLETE
        - CANCEL
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - category
    - description
    - end_date
    - file_attachment
    - goal
    - impact
    - modul
    - release_date
    - start_date
    - status
    - title
    type: object
  controllers.updateSubtaskRequest:
    properties:
      collaborator_id:
        type: integer
      cr_id:
        type: integer
      done:
        type: boolean
      due_date:
        type: string
      progress:
        maximum: 100
        type: integer
      task_name:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - cr_id
    - due_date
    - task_name
    type: object
  controllers.userRequest:
    properties:
      email:
        type: string
      fullname:
        type: string
      parent_pic:
        type: integer
      password:
        type: string
      role:
        enum:
        - Admin
        - Manager
        - PIC
        - Collaborator
        type: string
    required:
    - email
    - fullname
    - role
    type: object
  utils.APIResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/utils.Meta'
    type: object
  utils.Meta:
    properties:
      code:
        type: integer
      message:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for MonitoringCR.
  title: MonitoringCR API
  version: "1.0"
paths:
  /api/activities:
    get:
      description: Get paginated list of activities, optionally filter by cr_id
      parameters:
      - description: Filter by CR ID
        in: query
        name: cr_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List Activities
      tags:
      - Activity
    post:
      consumes:
      - application/json
      description: Create a new activity. UserID is extracted from token.
      parameters:
      - description: Create Activity payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.createActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Activity
      tags:
      - Activity
  /api/activities/{id}:
    delete:
      description: Delete activity by id.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Activity
      tags:
      - Activity
    get:
      description: Retrieve one activity by id.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Activity by ID
      tags:
      - Activity
    put:
      consumes:
      - application/json
      description: 'Fully update activity by id. Note: CRID and UserID cannot be updated
        here.'
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Activity payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.updateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update Activity
      tags:
      - Activity
  /api/cr/attachments/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or multiple files using multipart/form-data field name
        files. Returns local URLs for file_attachment.
      parameters:
      - collectionFormat: csv
        description: Attachment files
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload CR attachments to local storage
      tags:
      - CR
  /api/cr/charts:
    get:
      description: 'Return chart-ready data for pie and bar charts. Optional filters:
        status, category, modul, from, to.'
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Filter by modul
        in: query
        name: modul
        type: string
      - description: Start date (YYYY-MM-DD or RFC3339)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD or RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get CR chart analytics
      tags:
      - CR
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token.
      parameters:
      - description: Login payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Login user
      tags:
      - Auth
  /api/roles:
    get:
      description: Get available options for Role field.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Get role options
      tags:
      - Users
  /api/spr:
    get:
      description: Get paginated list of change requests.
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by modul
        in: query
        name: modul
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List Change Requests
      tags:
      - CR
    post:
      consumes:
      - application/json
      description: Create a new change request. Only Admin can create CR.
      parameters:
      - description: Create CR payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.createCRRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Change Request
      tags:
      - CR
  /api/spr/{id}:
    delete:
      description: Delete change request by id.
      parameters:
      - description: CR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Change Request
      tags:
      - CR
    get:
      description: Retrieve one change request by id.
      parameters:
      - description: CR ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Change Request by ID
      tags:
      - CR
    put:
      consumes:
      - application/json
      description: Fully update change request by id. State machine validation is
        applied.
      parameters:
      - description: CR ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update CR payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.updateCRRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update Change Request
      tags:
      - CR
  /api/spr/export:
    get:
      description: Export change requests to PDF format.
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by modul
        in: query
        name: modul
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Export Change Requests to PDF
      tags:
      - CR
  /api/spr/options:
    get:
      description: Get available options for CATEGORY and STATUS fields when creating/updating
        change request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get category and status options
      tags:
      - CR
  /api/subtasks:
    get:
      description: Get paginated list of subtasks, optionally filter by cr_id
      parameters:
      - description: Filter by CR ID
        in: query
        name: cr_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List Subtasks
      tags:
      - Subtask
    post:
      consumes:
      - application/json
      description: Create a new subtask.
      parameters:
      - description: Create Subtask payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.createSubtaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Subtask
      tags:
      - Subtask
  /api/subtasks/{id}:
    delete:
      description: Delete subtask by id.
      parameters:
      - description: Subtask ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Subtask
      tags:
      - Subtask
    get:
      description: Retrieve one subtask by id.
      parameters:
      - description: Subtask ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Subtask by ID
      tags:
      - Subtask
    put:
      consumes:
      - application/json
      description: Fully update subtask by id.
      parameters:
      - description: Subtask ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Subtask payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.updateSubtaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update Subtask
      tags:
      - Subtask
  /api/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - Users
    post:
      consumes:
      - application/json
      parameters:
      - description: User data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.userRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - Users
  /api/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete user by ID
      tags:
      - Users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.userRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update user by ID
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
