basePath: /
definitions:
  controllers.createActivityRequest:
    properties:
      action:
        enum:
        - Comment
        - Change
        type: string
      activity:
        type: string
      comment:
        type: string
      cr_id:
        type: integer
      reply_to_id:
        description: 'Optional: for replying to activities'
        type: integer
    required:
    - action
    - cr_id
    type: object
  controllers.createCRRequest:
    properties:
      category:
        enum:
        - FLOW
        - REPORT
        - INTERFACE
        - CONVERTION
        - ENHANCEMENT
        - FORM
        - CONFIGURATION
        - AUTHORIZATION
        type: string
      description:
        minLength: 3
        type: string
      end_date:
        type: string
      file_attachment:
        items:
          type: string
        minItems: 1
        type: array
      goal:
        type: string
      impact:
        type: string
      keterangan:
        type: string
      modul:
        enum:
        - FINANCE
        - MATERIAL MANAGEMENT
        - HUMAN RESOURCE
        - BASIS
        - ABAP
        type: string
      pic_id:
        type: integer
      release_date:
        type: string
      start_date:
        type: string
      status:
        enum:
        - DRAFT
        - ISSUED
        - IN_PROGRESS
        - APPROVAL_TO_RELEASE
        - RELEASE
        - APPROVAL_TO_COMPLETE
        - COMPLETE
        - CANCEL
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - category
    - description
    - end_date
    - file_attachment
    - goal
    - impact
    - modul
    - release_date
    - start_date
    - title
    type: object
  controllers.createDraftRequest:
    properties:
      category:
        enum:
        - FLOW
        - REPORT
        - INTERFACE
        - CONVERTION
        - ENHANCEMENT
        - FORM
        - CONFIGURATION
        - AUTORIZATION
        type: string
      description:
        type: string
      end_date:
        type: string
      file_attachment:
        items:
          type: string
        type: array
      goal:
        type: string
      impact:
        type: string
      keterangan:
        type: string
      modul:
        enum:
        - FINANCE
        - MATERIAL MANAGEMENT
        - HUMAN RESOURCE
        - BASIS
        - ABAP
        type: string
      pic_id:
        type: integer
      release_date:
        type: string
      start_date:
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - title
    type: object
  controllers.createSubtaskRequest:
    properties:
      collaborator_id:
        type: integer
      cr_id:
        type: integer
      done:
        type: boolean
      due_date:
        type: string
      progress:
        maximum: 100
        type: integer
      task_name:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - cr_id
    - due_date
    - task_name
    type: object
  controllers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  controllers.updateActivityRequest:
    properties:
      action:
        enum:
        - Comment
        - Change
        type: string
      activity:
        type: string
      comment:
        type: string
    required:
    - action
    type: object
  controllers.updateCRRequest:
    properties:
      category:
        enum:
        - FLOW
        - REPORT
        - INTERFACE
        - CONVERTION
        - ENHANCEMENT
        - FORM
        - CONFIGURATION
        - AUTHORIZATION
        type: string
      description:
        minLength: 3
        type: string
      end_date:
        type: string
      file_attachment:
        items:
          type: string
        minItems: 1
        type: array
      goal:
        type: string
      impact:
        type: string
      keterangan:
        type: string
      modul:
        enum:
        - FINANCE
        - MATERIAL MANAGEMENT
        - HUMAN RESOURCE
        - BASIS
        - ABAP
        type: string
      pic_id:
        type: integer
      release_date:
        type: string
      start_date:
        type: string
      status:
        enum:
        - DRAFT
        - ISSUED
        - IN_PROGRESS
        - APPROVAL_TO_RELEASE
        - RELEASE
        - APPROVAL_TO_COMPLETE
        - COMPLETE
        - CANCEL
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - category
    - description
    - end_date
    - file_attachment
    - goal
    - impact
    - modul
    - release_date
    - start_date
    - status
    - title
    type: object
  controllers.updateSubtaskRequest:
    properties:
      collaborator_id:
        type: integer
      cr_id:
        type: integer
      done:
        type: boolean
      due_date:
        type: string
      progress:
        maximum: 100
        type: integer
      task_name:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - cr_id
    - due_date
    - task_name
    type: object
  controllers.userRequest:
    properties:
      email:
        type: string
      fullname:
        type: string
      parent_pic:
        type: integer
      password:
        type: string
      role:
        enum:
        - Admin
        - Manager
        - PIC
        - Collaborator
        type: string
    required:
    - email
    - fullname
    - role
    type: object
  utils.APIResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/utils.Meta'
    type: object
  utils.Meta:
    properties:
      code:
        type: integer
      message:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for MonitoringCR.
  title: MonitoringCR API
  version: "1.0"
paths:
  /api/activities:
    get:
      description: Get paginated list of activities, optionally filter by cr_id
      parameters:
      - description: Filter by CR ID
        in: query
        name: cr_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List Activities
      tags:
      - Activity
    post:
      consumes:
      - application/json
      description: Create a new activity. UserID is extracted from token.
      parameters:
      - description: Create Activity payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.createActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Activity
      tags:
      - Activity
  /api/activities/{id}:
    delete:
      description: Delete activity by id.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Activity
      tags:
      - Activity
    get:
      description: Retrieve one activity by id.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Activity by ID
      tags:
      - Activity
    put:
      consumes:
      - application/json
      description: 'Fully update activity by id. Note: CRID and UserID cannot be updated
        here.'
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Activity payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.updateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update Activity
      tags:
      - Activity
  /api/cr/attachments/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or multiple files using multipart/form-data field name
        files. Returns local URLs for file_attachment.
      parameters:
      - collectionFormat: csv
        description: Attachment files
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload CR attachments to local storage
      tags:
      - CR
  /api/cr/lazy:
    get:
      description: Retrieve all change requests with lazy loading and pagination.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all CRs with pagination
      tags:
      - CR
  /api/cr/lazy/approval-to-complete:
    get:
      description: Retrieve approval to complete change requests with lazy loading
        pagination. Supports infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Approval to Complete CRs with pagination
      tags:
      - CR
  /api/cr/lazy/approval-to-release:
    get:
      description: Retrieve approval to release change requests with lazy loading
        pagination. Supports infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Approval to Release CRs with pagination
      tags:
      - CR
  /api/cr/lazy/cancel:
    get:
      description: Retrieve cancelled change requests with lazy loading pagination.
        Supports infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Cancelled CRs with pagination
      tags:
      - CR
  /api/cr/lazy/complete:
    get:
      description: Retrieve complete change requests with lazy loading pagination.
        Supports infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Complete CRs with pagination
      tags:
      - CR
  /api/cr/lazy/draft:
    get:
      description: Retrieve draft change requests with lazy loading pagination. Supports
        infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Draft CRs with pagination
      tags:
      - CR
  /api/cr/lazy/in-progress:
    get:
      description: Retrieve in progress change requests with lazy loading pagination.
        Supports infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get In Progress CRs with pagination
      tags:
      - CR
  /api/cr/lazy/issued:
    get:
      description: Retrieve issued change requests with lazy loading pagination. Supports
        infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Issued CRs with pagination
      tags:
      - CR
  /api/cr/lazy/release:
    get:
      description: Retrieve released change requests with lazy loading pagination.
        Supports infinite scroll.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Released CRs with pagination
      tags:
      - CR
  /api/cr/modul/{modul}:
    get:
      description: Get paginated list of change requests filtered by modul.
      parameters:
      - description: CR modul
        in: path
        name: modul
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Change Requests by modul
      tags:
      - CR
  /api/cr/status/{status}:
    get:
      description: Get paginated list of change requests filtered by status.
      parameters:
      - description: CR status
        in: path
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Change Requests by status
      tags:
      - CR
  /api/dashboard/due-today:
    get:
      description: Retrieve change requests that are due today, grouped by title,
        PIC, module, and status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get CRs Due Today Statistics
      tags:
      - Charts
  /api/dashboard/kpi-summary:
    get:
      description: Retrieve key performance indicators including total CR, in-progress
        count, near deadline, overdue, cancelled, and completed items.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get KPI Summary Dashboard
      tags:
      - Charts
  /api/dashboard/lifecycle-line-chart:
    get:
      description: Retrieve monthly progression of CRs through ISSUED, IN_PROGRESS,
        and COMPLETE statuses. Supports filtering by year.
      parameters:
      - description: 'Year filter (default: current year)'
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get CR Lifecycle Line Chart
      tags:
      - Charts
  /api/dashboard/module-category:
    get:
      description: Retrieve cross-tabulation of modules and categories showing the
        count of CRs for each combination.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Module vs Category Statistics
      tags:
      - Charts
  /api/dashboard/module-health-overview:
    get:
      description: Retrieve health status of each module based on overdue percentage,
        completion rate, and overall health scoring (Baik/Cukup/Buruk).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Module Health Overview
      tags:
      - Charts
  /api/dashboard/module-status:
    get:
      description: Retrieve cross-tabulation of modules and statuses showing the count
        of CRs for each combination.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Module vs Status Statistics
      tags:
      - Charts
  /api/dashboard/top-pic:
    get:
      description: Retrieve PIC (Person In Charge) statistics sorted by CR count,
        including in-progress and near-deadline counts with pagination.
      parameters:
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Limit (default: 5, max: 5)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Top PIC Statistics
      tags:
      - Charts
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token.
      parameters:
      - description: Login payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Login user
      tags:
      - Auth
  /api/roles:
    get:
      description: Get available options for Role field.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Get role options
      tags:
      - Users
  /api/spr:
    get:
      description: Get paginated list of change requests.
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by modul
        in: query
        name: modul
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List Change Requests
      tags:
      - CR
    post:
      consumes:
      - application/json
      description: Create a new change request. Only Admin can create CR.
      parameters:
